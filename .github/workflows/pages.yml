name: Byg og udgiv U13-siden

on:
  schedule:
    # Dagligt 01:23 UTC = 02:23 dansk normaltid / 03:23 sommertid. GitHub-cron
    # koerer altid i UTC og foelger ikke sommertid, saa tidspunktet er valgt saa
    # det ligger midt om natten i Danmark aaret rundt - og efter midnat UTC, saa
    # "Naeste frist om N dage" regnes paa det nye doegn.
    # Skaeve minutter med vilje: kl. hel og halv er GitHubs travleste, og
    # planlagte koersler bliver forsinket derefter.
    # Dagligt fordi siden skriver "Naeste frist om N dage", som bliver forkert
    # efter et doegn, ogsaa naar selve data staar stille.
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# En ny koersel maa ikke afbryde en igangvaerende udgivelse midtvejs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py og testene bruger kun standardbiblioteket - intet at installere.
      - name: Kør tests
        run: python -m unittest test_build

      # Aargang og landsdel staar eksplicit her: skift de fire vaerdier for at
      # bygge fx en U11-side eller en anden landsdel. Standarderne i build.py
      # er de samme (U13 / Fyn).
      # Fejler bygningen, stopper jobbet, og den hidtidige side bliver staaende.
      - name: Hent turneringer og byg siden
        run: >-
          python build.py --out docs
          --age-group-id 4 --age-group-label U13
          --region-id 16 --region-label Fyn

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
