name: Byg og udgiv U13-siden

on:
  schedule:
    # Maalet: koerslen skal ligge mellem kl. 01 og 04 dansk tid, aaret rundt.
    #
    # GitHub-cron koerer altid i UTC og foelger ikke sommertid, saa vinduet
    # flytter sig: dansk 01-04 er UTC 00-03 om vinteren (UTC+1) og UTC 23-02
    # om sommeren (UTC+2). Faellesmaengden er UTC 00:00-02:00.
    #
    # 00:17 UTC giver 01:17 vintertid / 02:17 sommertid - og dermed knap 3
    # timers luft om vinteren og 1t43m om sommeren, foer en forsinket koersel
    # ville falde ud af vinduet. Planlagte koersler bliver rutinemaessigt
    # forsinket 10-60 min naar GitHub har travlt, saa den luft er noedvendig.
    # Skaeve minutter med vilje: kl. hel og halv er de travleste slots.
    #
    # Dagligt fordi siden skriver "Naeste frist om N dage", som bliver forkert
    # efter et doegn, ogsaa naar selve data staar stille.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# En ny koersel maa ikke afbryde en igangvaerende udgivelse midtvejs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.py og testene bruger kun standardbiblioteket - intet at installere.
      - name: Kør tests
        run: python -m unittest test_build

      # Aargang og landsdel staar eksplicit her: skift de fire vaerdier for at
      # bygge fx en U11-side eller en anden landsdel. Standarderne i build.py
      # er de samme (U13 / Fyn).
      # Fejler bygningen, stopper jobbet, og den hidtidige side bliver staaende.
      - name: Hent turneringer og byg siden
        run: >-
          python build.py --out docs
          --age-group-id 4 --age-group-label U13
          --region-id 16 --region-label Fyn

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
